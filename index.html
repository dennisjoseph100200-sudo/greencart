<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23176B45'/%3E%3Cg transform='translate(3.2 3.2) scale(.8)' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 9h3l3 12h13l3-9H9'/%3E%3Ccircle cx='12' cy='26' r='1.5'/%3E%3Ccircle cx='22' cy='26' r='1.5'/%3E%3Cpath d='M16 11c0-4 3-6 7-6 0 4-3 6-7 6z' fill='%2375A878'/%3E%3C/g%3E%3C/svg%3E"><title>GreenCart – Shop Green. Live Better.</title><style>
:root{--g:#176B45;--lg:#75A878;--w:#F7F7F0;--c:#26332B;--mut:#56655b;--tint:#e8f1e6;--bd:#dfe5da;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--w);color:var(--c);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}button,input,select{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--lg);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 30px}.top{background:var(--g);color:#fff;text-align:center;font-size:13px;padding:6px}
header{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;padding:14px 20px;max-width:1180px;margin:0 auto}
.logo{display:flex;gap:8px;align-items:center;font-weight:700;font-size:21px;color:var(--g)}nav{display:flex;gap:18px;font-weight:500}nav a.on{color:var(--g);font-weight:700}
.sr{flex:1;min-width:170px;max-width:340px;margin-left:auto}input,select{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:12px;background:#fff}input[type=checkbox],input[type=radio]{width:auto}
.ic{position:relative;font-size:19px;padding:4px 7px}.ic b{position:absolute;top:-4px;right:-2px;background:var(--g);color:#fff;font-size:10px;border-radius:9px;padding:0 5px}
.btn{display:inline-flex;gap:6px;justify-content:center;align-items:center;padding:10px 20px;border-radius:999px;border:1.5px solid var(--g);background:var(--g);color:#fff;font-weight:600;cursor:pointer}.btn.o{background:transparent;color:var(--g)}.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:16px;position:relative}.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.art{border-radius:14px;aspect-ratio:4/3;overflow:hidden;display:block}.art svg,.art img{width:100%;height:100%;display:block;object-fit:cover}
h1{font-size:clamp(30px,5vw,46px);line-height:1.1;margin:.3em 0}h2{font-size:26px;margin:1.6em 0 .6em}h3{margin:.3em 0}.mut{color:var(--mut)}.gr{color:var(--g)}.sm{font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}.grow{flex:1}
.hero,.two,.pd,.shop,.split{display:grid;gap:28px;align-items:center}.hero,.pd,.split{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr 340px;align-items:start}.shop{grid-template-columns:220px 1fr;align-items:start}
.chip{display:inline-block;border:1px solid var(--bd);border-radius:99px;padding:2px 12px;font-size:13px;background:#fff}.eyebrow{color:var(--g);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.band{background:var(--g);color:#fff;border-radius:20px;padding:28px;display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:30px 0}.band .btn{background:#fff;color:var(--g)}.tint{background:var(--tint)}
.pc{display:flex;flex-direction:column;gap:2px}.hb{position:absolute;top:22px;right:22px;border:0;background:#fffc;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:17px;color:var(--g)}
.li{display:flex;gap:14px;align-items:center;margin-bottom:12px}.li .art{width:80px;flex:none}.qty{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:99px;background:#fff}.qty button{border:0;background:none;width:34px;height:34px;cursor:pointer;font-size:18px}.qty output{min-width:24px;text-align:center}
.s{display:flex;justify-content:space-between;margin:6px 0}.tl{font-size:22px;font-weight:700;color:var(--g)}.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f2 .w{grid-column:1/-1}label{font-size:13px;font-weight:600;display:block;margin:10px 0 4px}
.err{color:#b3261e;font-size:13px;min-height:18px;margin:6px 0}.ok{color:var(--g);font-weight:600}.pwb{position:relative}.pwb button{position:absolute;right:8px;top:7px;border:0;background:none;color:var(--g);cursor:pointer;font-size:13px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd)}
footer{background:var(--c);color:#d6dfd8;margin-top:40px;padding:36px 0 10px}footer .logo{color:#fff}.fg{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:24px;padding-bottom:20px}.fg a{display:block;margin:6px 0;font-size:14px}.fg b{color:#fff}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--c);color:#fff;padding:12px 20px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%}#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:#b3261e}
@media(max-width:820px){.hero,.two,.pd,.shop,.split{grid-template-columns:1fr}.fg{grid-template-columns:1fr 1fr}.sr{max-width:none;order:9;flex-basis:100%}.f2{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><script>

-free']]].map(([id,n,p,c,m,t,col,bg,r,pop,d,f])=>({id,n,p,c:C[c],m,t,col,bg,r,pop,d,f}));

const art=p=>IMG[p.id]?`<img src="${IMG[p.id]}" alt="${p.n}" data-id="${p.id}" decoding="async">`:svg(p);
addEventListener("error",e=>{const t=e.target;if(t&&t.tagName=="IMG"&&t.dataset.id)t.outerHTML=svg(byId(t.dataset.id))},true);
const LOGO='<svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h3l3 12h13l3-9H9"/><circle cx="12" cy="26" r="1.5"/><circle cx="22" cy="26" r="1.5"/><path d="M16 11c0-4 3-6 7-6 0 4-3 6-7 6z" fill="#75A878"/></svg>';
let cart=ld('gc_cart',[]),user=ld('gc_user',null),users=ld('gc_users',[]),pts=ld('gc_pts',0),orders=ld('gc_orders',[]),wish=ld('gc_wish',[]),rw=ld('gc_rw',0),cp=ld('gc_cp',''),act=ld('gc_act',[]),ln=null;
const save=()=>{sv('gc_cart',cart);sv('gc_user',user);sv('gc_users',users);sv('gc_pts',pts);sv('gc_orders',orders);sv('gc_wish',wish);sv('gc_rw',rw);sv('gc_cp',cp);sv('gc_act',act)};
const byId=id=>P.find(p=>p.id==id),dt=()=>new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}),em=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
const tot=()=>{const sub=cart.reduce((s,i)=>s+byId(i.id).p*i.q,0),d=Math.min(sub,rw+(cp?Math.round(sub*.1):0)),ship=!sub||sub>=999?0:49,g=Math.round((sub-d)*.05);return{sub,d,ship,g,t:sub-d+ship+g,n:cart.reduce((s,i)=>s+i.q,0)}};
let tm;const toast=(m,bad)=>{const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(tm);tm=setTimeout(()=>t.className='',2800)};
const hs=async s=>{const b=new TextEncoder().encode('gc-demo:'+s);if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}return btoa(s)};
const pc=p=>`<article class="card pc"><a href="#/p/${p.id}" class="art">${art(p)}</a><button class="hb" data-a="w" data-id="${p.id}" aria-label="Save ${p.n} to wishlist">${wish.includes(p.id)?'♥':'♡'}</button><div class="mut sm">${p.m}</div><h3><a href="#/p/${p.id}">${p.n}</a></h3><div><b class="gr">${inr(p.p)}</b> <span class="mut sm">★ ${p.r}</span></div><div class="row"><button class="btn grow" data-a="add" data-id="${p.id}">+ Add to cart</button><a class="btn o" href="#/p/${p.id}">Details</a></div></article>`;
